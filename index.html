<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Expense Tracker</h1>
    <div class="topbar-actions">
      <button type="button" class="btn ghost" id="export-btn">Export CSV</button>
      <label class="btn ghost" for="import-input">Import CSV</label>
      <input type="file" id="import-input" accept=".csv,text/csv" hidden />
    </div>
  </header>

  <main class="layout">
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Add expense</h2>
      <form id="expense-form" novalidate>
        <input type="hidden" name="id" />
        <div class="field">
          <label for="amount">Amount</label>
          <input id="amount" name="amount" inputmode="decimal" placeholder="0.00" autocomplete="off" />
          <p class="error" data-error="amount"></p>
        </div>
        <div class="field">
          <label for="description">Description</label>
          <input id="description" name="description" maxlength="120" placeholder="Groceries" autocomplete="off" />
          <p class="error" data-error="description"></p>
        </div>
        <div class="row">
          <div class="field">
            <label for="date">Date</label>
            <input id="date" name="date" type="date" />
            <p class="error" data-error="date"></p>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category"></select>
          </div>
        </div>
        <div class="field">
          <label for="note">Note <span class="muted">(optional)</span></label>
          <textarea id="note" name="note" rows="2" maxlength="500"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary" id="submit-btn">Add expense</button>
          <button type="button" class="btn ghost" id="cancel-edit" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="summary" aria-label="Summary">
      <div class="card stat">
        <span class="stat-label">Spent in <span id="month-label"></span></span>
        <span class="stat-value" id="month-total">$0.00</span>
        <div class="budget">
          <div class="budget-bar"><div class="budget-fill" id="budget-fill"></div></div>
          <div class="budget-row">
            <span id="budget-text" class="muted"></span>
            <button type="button" class="link" id="budget-btn">Set budget</button>
          </div>
        </div>
      </div>
      <div class="card">
        <h2>By category</h2>
        <ul class="cat-list" id="cat-list"></ul>
      </div>
      <div class="card">
        <h2>Last 6 months</h2>
        <div class="bars" id="month-bars"></div>
      </div>
    </section>

    <section class="card list-card" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">Expenses</h2>
        <span class="muted" id="list-count"></span>
      </div>
      <div class="filters">
        <input type="month" id="filter-month" aria-label="Filter by month" />
        <select id="filter-category" aria-label="Filter by category"></select>
        <input type="search" id="filter-query" placeholder="Search…" aria-label="Search expenses" />
      </div>
      <ul class="expense-list" id="expense-list"></ul>
      <p class="empty" id="empty-state" hidden>No expenses here yet. Add one to get started.</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
